apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "tiyn.name" . }}
  labels:
    {{- include "tiyn.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      {{- include "tiyn.selector" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "tiyn.selector" . | nindent 8 }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- if .Values.secret.create }}
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
        {{- end }}
    spec:
      terminationGracePeriodSeconds: 45
      {{- with .Values.image.pullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        {{- if .Values.postgres.enabled }}
        - name: wait-for-postgres
          image: {{ .Values.postgres.image }}
          command:
            - sh
            - -c
            - until pg_isready -h {{ include "tiyn.name" . }}-postgres -p 5432 -U {{ .Values.postgres.user }}; do sleep 2; done
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
        {{- end }}
        {{- if .Values.seaweedfs.enabled }}
        - name: ensure-bucket
          image: {{ .Values.seaweedfs.awsCliImage }}
          command:
            - sh
            - -c
            - >-
              until aws --endpoint-url "$S3_ENDPOINT" s3api head-bucket --bucket "$S3_BUCKET" 2>/dev/null
              || aws --endpoint-url "$S3_ENDPOINT" s3api create-bucket --bucket "$S3_BUCKET" >/dev/null 2>&1;
              do sleep 2; done
          envFrom:
            - configMapRef:
                name: {{ include "tiyn.name" . }}-config
          env:
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: {{ include "tiyn.secretName" . }}
                  key: S3_ACCESS_KEY
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "tiyn.secretName" . }}
                  key: S3_SECRET_KEY
            - name: AWS_DEFAULT_REGION
              value: {{ .Values.config.s3.region | quote }}
            - name: HOME
              value: /tmp
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
        {{- end }}
      containers:
        - name: tiyn
          image: "{{ .Values.image.repository }}:{{ required "image.tag is required (use the commit sha)" .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: {{ include "tiyn.name" . }}-config
            - secretRef:
                name: {{ include "tiyn.secretName" . }}
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 5
            failureThreshold: 36
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            periodSeconds: 5
            failureThreshold: 3
          lifecycle:
            preStop:
              exec:
                command: ["sleep", "5"]
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            {{- if eq .Values.config.notificationSender "fcm" }}
            - name: fcm
              mountPath: /etc/fcm
              readOnly: true
            {{- end }}
      volumes:
        - name: tmp
          emptyDir: {}
        {{- if eq .Values.config.notificationSender "fcm" }}
        - name: fcm
          secret:
            secretName: {{ required "fcm.existingSecret is required for the fcm sender" .Values.fcm.existingSecret }}
        {{- end }}

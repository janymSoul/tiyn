spring:
  application:
    name: tiyn
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/tiyn}
    username: ${DATABASE_USER:tiyn}
    password: ${DATABASE_PASSWORD:tiyn}
    hikari:
      maximum-pool-size: ${DB_MAX_CONNS:20}
  servlet:
    multipart:
      max-file-size: 8MB
      max-request-size: 9MB
  jackson:
    deserialization:
      fail-on-unknown-properties: true
  flyway:
    locations: classpath:db/migration
  modulith:
    events:
      jdbc:
        schema-initialization:
          enabled: false
      republish-outstanding-events-on-restart: true

tiyn:
  events:
    resubmit-after: ${EVENTS_RESUBMIT_AFTER:PT1M}
  task:
    max-reward-amount: ${TASK_MAX_REWARD_AMOUNT:10000000}
  notification:
    delivered-retention: ${NOTIFICATION_DELIVERED_RETENTION:P30D}
    fcm:
      credentials-file: ${FCM_CREDENTIALS_FILE:}
      dry-run: ${FCM_DRY_RUN:false}
  dashboard:
    recent-window: ${DASHBOARD_RECENT_WINDOW:P7D}
    max-tasks: ${DASHBOARD_MAX_TASKS:50}
  media:
    s3:
      endpoint: ${S3_ENDPOINT:}
      region: ${S3_REGION:us-east-1}
      bucket: ${S3_BUCKET:}
      access-key: ${S3_ACCESS_KEY:}
      secret-key: ${S3_SECRET_KEY:}
      view-url-ttl: ${S3_VIEW_URL_TTL:PT10M}
  ledger:
    min-payout-amount: ${LEDGER_MIN_PAYOUT_AMOUNT:10000}
    payout-expiry: ${LEDGER_PAYOUT_EXPIRY:P7D}
  jwt:
    secret: ${JWT_SECRET}
    ttl: ${JWT_TTL:168h}
  google:
    client-ids: ${GOOGLE_CLIENT_IDS}
  tick:
    interval: ${TICK_INTERVAL:PT1M}

server:
  port: ${HTTP_PORT:8080}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
